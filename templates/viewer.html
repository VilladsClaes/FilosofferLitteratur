<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filsofografen – et univers af filosoffer, begreber og værker</title>
<style>
  :root {
    --bg:#05070d; --panel:#0d1220ee; --line:#22304d; --txt:#e8eefb; --dim:#8fa0c0;
    --filosof:#5b9dff; --begreb:#f2a54a; --artefakt:#4fd48a; --epoke:#b784ff;
    --accent:#7fb2ff;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--txt);
    font:14px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif; }
  canvas { display:block; position:fixed; inset:0; cursor:grab; }
  canvas.drag { cursor:grabbing; }

  header { position:fixed; top:0; left:0; right:0; z-index:6; display:flex; align-items:center;
    gap:14px; flex-wrap:wrap; padding:9px 16px; background:linear-gradient(180deg,#05070df2,#05070d00); }
  h1 { font-size:15px; margin:0; font-weight:650; white-space:nowrap; }
  h1 small { color:var(--dim); font-weight:400; margin-left:8px; }
  .seg { display:flex; border:1px solid var(--line); border-radius:9px; overflow:hidden;
    background:#0b1020cc; backdrop-filter:blur(6px); }
  .seg button { background:transparent; color:var(--dim); border:0; padding:6px 12px; cursor:pointer; font:inherit; }
  .seg button.on { background:#1d2b4a; color:var(--txt); }
  .toggles { display:flex; gap:11px; align-items:center; }
  .toggles label { display:flex; align-items:center; gap:6px; color:var(--dim); cursor:pointer; font-size:13px; }
  .toggles input { accent-color:var(--filosof); }
  .dot { width:9px; height:9px; border-radius:50%; display:inline-block; }
  .search { position:relative; margin-left:auto; }
  .search input { width:230px; padding:7px 11px; border-radius:9px; border:1px solid var(--line);
    background:#0b1020cc; color:var(--txt); font:inherit; }
  .hits { position:absolute; top:108%; right:0; width:330px; max-height:330px; overflow:auto;
    background:var(--panel); border:1px solid var(--line); border-radius:10px; box-shadow:0 14px 40px #000a; }
  .hits div { padding:7px 11px; cursor:pointer; display:flex; gap:9px; align-items:baseline; }
  .hits div:hover { background:#16203a; }
  .hits b { font-weight:550; }
  .hits span { color:var(--dim); font-size:12px; margin-left:auto; }

  .legend { position:fixed; left:14px; bottom:14px; z-index:4; background:var(--panel);
    border:1px solid var(--line); border-radius:10px; padding:10px 13px; font-size:12.5px; color:var(--dim); }
  .legend div { display:flex; align-items:center; gap:8px; padding:2px 0; }
  .legend .h { display:block; color:#6d7c9b; font-size:10.5px; text-transform:uppercase;
    letter-spacing:.09em; margin:7px 0 3px; }
  .legend .h:first-child { margin-top:0; }
  .legend .h small { display:block; text-transform:none; letter-spacing:0; font-size:11px; }

  /* Kantfiltrering: hører til ved visningstilstandene i værktøjslinjen, så den
     ikke dækker spørgefeltet nederst. */
  .eseg { display:flex; align-items:center; gap:2px; border:1px solid var(--line); border-radius:9px;
    background:#0b1020cc; backdrop-filter:blur(6px); padding:3px 7px; }
  .eseg .lbl { color:#6d7c9b; font-size:10.5px; text-transform:uppercase; letter-spacing:.09em;
    margin:0 4px 0 2px; }
  .eseg button { display:flex; align-items:center; gap:6px; background:transparent; border:0;
    color:#7f8ea9; font:inherit; font-size:12px; padding:3px 7px; border-radius:7px; cursor:pointer; }
  .eseg button:hover { background:#16203a; color:var(--txt); }
  .eseg button.on { background:#1d2b4a; color:var(--txt); }
  .eseg button i { width:16px; height:0; flex:0 0 auto; border-top-width:2px; border-top-style:solid; }
  .hint { position:fixed; right:14px; bottom:14px; z-index:4; color:var(--dim); font-size:12px;
    background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 12px; max-width:330px; }

  /* ── Spørgefelt ───────────────────────────────────────────────────────── */
  .askwrap { position:fixed; left:50%; transform:translateX(-50%); bottom:14px; z-index:6; width:min(760px,94vw); }
  .askbar { display:flex; gap:8px; background:#0b1020f2; border:1px solid var(--line);
    border-radius:12px; padding:8px 8px 8px 14px; box-shadow:0 14px 40px #000a; }
  .askbar input { flex:1; background:transparent; border:0; color:var(--txt); font:inherit; outline:0; }
  .askbar input::placeholder { color:#6d7c9b; }
  .askbar button { background:#22406e; color:#dce8ff; border:0; border-radius:8px; padding:7px 14px;
    font:inherit; cursor:pointer; }
  .askbar button:hover { background:#2b5188; }
  .chips { display:flex; gap:7px; flex-wrap:wrap; margin-top:8px; }
  .chips button { background:#0e1526cc; color:var(--dim); border:1px solid var(--line); border-radius:20px;
    padding:4px 12px; font-size:12.5px; cursor:pointer; }
  .chips button:hover { color:var(--txt); border-color:#3a5285; }
  .answer { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:13px 15px;
    margin-bottom:9px; max-height:46vh; overflow:auto; box-shadow:0 14px 40px #000a; }
  .answer h3 { margin:0 0 3px; font-size:15px; }
  .answer .sub { color:var(--dim); font-size:12.5px; margin-bottom:9px; }
  .answer .row { display:flex; gap:9px; align-items:baseline; padding:3px 0; cursor:pointer; }
  .answer .row:hover b { color:#fff; text-decoration:underline; }
  .answer .row i { color:var(--dim); font-style:normal; font-size:11px; background:#16203a;
    border-radius:4px; padding:1px 6px; flex:0 0 auto; }
  .answer .row b { font-weight:500; }
  .answer .row span.t { color:var(--dim); font-size:11.5px; margin-left:auto; }
  a.kilde { color:#7fb2ff; font-size:11px; text-decoration:none; flex:0 0 auto; }
  a.kilde:hover { text-decoration:underline; color:#a9ccff; }
  .answer .none { color:var(--dim); }
  .answer .path { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:6px; }
  .answer .path b { background:#16203a; border-radius:6px; padding:3px 9px; font-weight:500; cursor:pointer; }
  .answer .path b:hover { background:#22406e; }
  .answer .path em { color:var(--dim); font-style:normal; font-size:11px; }

  /* ── Detaljepanel ─────────────────────────────────────────────────────── */
  aside { position:fixed; top:0; right:0; bottom:0; width:390px; max-width:94vw; z-index:7;
    background:var(--panel); border-left:1px solid var(--line); padding:16px 18px 90px; overflow:auto;
    transform:translateX(102%); transition:transform .18s ease; }
  aside.open { transform:none; }
  aside .hero { width:100%; aspect-ratio:1; border-radius:14px; background:#080c15; border:1px solid var(--line);
    display:block; object-fit:cover; margin-bottom:12px; }
  aside h2 { margin:0 0 2px; font-size:20px; line-height:1.25; }
  aside .meta { color:var(--dim); font-size:12.5px; margin-bottom:12px; }
  aside .note { background:#141d33; border-radius:9px; padding:10px 12px; color:#cbd5e7; font-size:13px; margin:0 0 14px; }
  aside a { color:var(--accent); }
  aside .close { position:absolute; top:12px; right:14px; background:#0b1020cc; border:1px solid var(--line);
    color:var(--dim); font-size:20px; cursor:pointer; line-height:1; border-radius:8px; width:32px; height:32px; }
  aside .tools { display:flex; gap:8px; margin-bottom:6px; }
  aside .tools button { flex:1; background:#16233d; color:#cfe0ff; border:1px solid var(--line);
    border-radius:8px; padding:7px 8px; font:inherit; font-size:12.5px; cursor:pointer; }
  aside .tools button:hover { background:#1f305a; }
  h3.sec { font-size:11.5px; text-transform:uppercase; letter-spacing:.09em; color:var(--dim);
    margin:15px 0 6px; border-bottom:1px solid var(--line); padding-bottom:4px; }
  .rel { display:flex; gap:8px; padding:4px 0; cursor:pointer; align-items:baseline; }
  .rel:hover b { color:#fff; text-decoration:underline; }
  .rel b { font-weight:500; }
  .rel i { color:var(--dim); font-style:normal; font-size:11px; flex:0 0 auto; background:#16203a;
    border-radius:4px; padding:1px 6px; }
  .rel .t { color:var(--dim); font-size:11.5px; margin-left:auto; }
  .evtag { font-size:10.5px; border:1px solid currentColor; border-radius:20px; padding:0 6px;
    flex:0 0 auto; opacity:.85; }
  .prov { color:#6d7c9b; font-size:11px; flex:0 0 auto; border-bottom:1px dotted #46587a; cursor:help; }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<header>
  <h1>Filsofografen<small id="sub"></small></h1>
  <div class="seg" id="modes">
    <button data-mode="alt" class="on">Alt</button>
    <button data-mode="filosof">Filosoffer</button>
    <button data-mode="begreb">Begreber</button>
    <button data-mode="tidslinje">Tidslinje</button>
  </div>
  <div class="toggles" id="toggles">
    <label><input type="checkbox" data-g="filosof" checked><span class="dot" style="background:var(--filosof)"></span>Filosoffer</label>
    <label><input type="checkbox" data-g="begreb" checked><span class="dot" style="background:var(--begreb)"></span>Begreber</label>
    <label><input type="checkbox" data-g="artefakt" checked><span class="dot" style="background:var(--artefakt)"></span>Artefakter</label>
    <label><input type="checkbox" data-g="epoke"><span class="dot" style="background:var(--epoke)"></span>Epoker</label>
  </div>
  <div class="eseg" id="evidens" title="Kanternes farve viser hvor godt forbindelsen er belagt"></div>
  <div class="search">
    <input id="q" type="search" placeholder="Søg …  (filosof, begreb, værk)" autocomplete="off">
    <div class="hits" id="hits" hidden></div>
  </div>
</header>

<div class="legend" id="legend"></div>
<div class="hint">Træk = roter · rul = zoom · højreklik-træk = panorér<br>klik en planet for detaljer · dobbeltklik låser fast<br>kanternes farve er deres evidensgrad – filtrér i «Kanter» øverst<br>«Tidslinje» lægger samme graf ud efter årstal</div>

<div class="askwrap">
  <div class="answer" id="answer" hidden></div>
  <div class="askbar">
    <input id="ask" placeholder="Stil et spørgsmål …  fx «hvad opfandt Kant?» eller «find stien fra Platon til Nietzsche»" autocomplete="off">
    <button id="askBtn">Spørg</button>
  </div>
  <div class="chips" id="chips"></div>
</div>

<aside id="panel"></aside>

<script>
const DATA = __FILOSOFI_DATA__;

const COLORS = { filosof:'#5b9dff', begreb:'#f2a54a', artefakt:'#4fd48a', epoke:'#b784ff' };
const GROUP_DA = { filosof:'Filosof', begreb:'Begreb', artefakt:'Artefakt', epoke:'Epoke' };
const REL_DA = {
  INFLUENCED:['påvirkede','påvirket af'], INVENTED:['opfandt','opfundet af'],
  DEVELOPED:['videreudviklede','videreudviklet af'], REVISED:['omarbejdede','omarbejdet af'],
  CRITIQUED:['kritiserede','kritiseret af'], FOUNDED:['grundlagde','grundlagt af'],
  MEMBER_OF:['tilhører','har som medlem'], AUTHORED:['skrev','skrevet af'], CREATED:['skabte','skabt af'],
  LIVED_IN:['levede i','samtidig tænker'], EXPRESSED_IN:['udtrykt i','udtrykker'],
  GAVE_RISE_TO:['gav ophav til','opstod af'], DEVELOPS_FROM:['udspringer af','videreført i'],
  CENTRAL_IN:['central i','har som kernebegreb'], FOLLOWS:['følger efter','efterfølges af'],
};
const TYPE_DA = DATA.meta.artefaktTypeDa || {};
const IMG_DIR = 'images/';

// ── Evidensgrader ───────────────────────────────────────────────────────────
// Hver kant bærer sin evidensgrad fra data (DATA.meta.evidens). Graderne er
// rangeret efter hvor godt forbindelsen er belagt, og farves derefter: grøn =
// dokumenteret, gul = maskinelt udledt, rød stiplet = bredt slægtskab, dæmpet
// blå = ren optegnelse. Kanten står altid i sin grads farve – også når en node
// er valgt, så man kan se hvor de svage led sidder.
const EVIDENS_FARVE = { belagt:'#43e08a', afledt:'#ffc861', slaegtskab:'#ff6f61', katalog:'#6f8fc0' };
const EVIDENS_ALFA  = { belagt:.85,     afledt:.20,     slaegtskab:.40,      katalog:.10     };
const EVIDENS_BREDDE= { belagt:1.6,     afledt:1,       slaegtskab:1.2,      katalog:1       };
const EVIDENS_STIPL = { slaegtskab:[3,3] };
const GRADE = new Map((DATA.meta.evidens || []).map(g => [g.id, g]));
const GRADE_IDS = [...GRADE.keys()];
const GRADE_ALLE_ON = Object.fromEntries(GRADE_IDS.map(id => [id, true]));

// ── Indeks ──────────────────────────────────────────────────────────────────
const nodes = DATA.nodes;
const byId = new Map(nodes.map(n => [n.id, n]));
const links = DATA.links.filter(l => byId.has(l.kilde) && byId.has(l.maal));
const out = new Map(), inn = new Map();
for (const n of nodes) { out.set(n.id, []); inn.set(n.id, []); }
const linkKey = new Map(); // "a|b" -> link

// kildeURL og evidens følger kanten, så panelet kan vise hvad påstanden om
// indflydelse bygger på – og hvad den ikke gør.
function edgeOf(l, id, dir) {
  return { id, type:l.type, dir, kildeURL:l.kildeURL || '', evidens:l.evidens || '' };
}
for (const l of links) {
  out.get(l.kilde).push(edgeOf(l, l.maal, 'out'));
  inn.get(l.maal).push(edgeOf(l, l.kilde, 'in'));
  linkKey.set(l.kilde+'|'+l.maal, l); linkKey.set(l.maal+'|'+l.kilde, l);
}
const UNDIR = new Map(nodes.map(n => [n.id, []]));
for (const l of links) { UNDIR.get(l.kilde).push(l.maal); UNDIR.get(l.maal).push(l.kilde); }

// ── Tidslinjen ──────────────────────────────────────────────────────────────
// Samme univers, men x-aksen er årstal i stedet for det indbagte 3D-layout, så
// tænkere, begreber og artefakter kan læses kronologisk fra oldtiden til i dag.
// Hver nodefamilie har sin bane, og epokerne tegnes som bånd bagved. Begreberne
// har ikke eget årstal; deres `aar` er afledt (se scripts/model.js), og
// `aarKilde` siger hvad placeringen hviler på, så viseren kan sige det højt.
const TID = DATA.meta.tidslinje || { min:-600, max:2026, antal:0, udenAar:0 };
const TID_SPAN = 2200;                       // verdensenheder fra første til sidste årstal
// Tidslinjen er et diagram: x-aksen zoomer med årstallene, men banerne og
// rækkerne holder deres plads på skærmen. Ellers ville de tre baner skride fra
// hinanden og forsvinde ud af billedet, når man zoomede ind på et årti.
const TID_BANE_PX = 130;                     // banernes indbyrdes afstand i pixels
const TID_RAEKKE_PX = 15;                    // lodret afstand mellem to rækker
const TID_TOP_PX = -TID_BANE_PX - 80;        // båndenes overkant
const TID_BUND_PX = TID_BANE_PX + 80;        // båndenes underkant
const TID_AKSE_PX = TID_BANE_PX + 120;       // årstalsaksen under nederste bane
const TID_BANER = [
  { gruppe:'filosof',  y:-TID_BANE_PX },
  { gruppe:'begreb',   y:0 },
  { gruppe:'artefakt', y:TID_BANE_PX },
];
const TID_MINDSTE_PX = 18;                   // mindste vandrette afstand i samme række
const TID_MAKS_RAEKKE = 3;                   // hvor mange rækker banen må bruge om midten
const TID_MID = (TID.min + TID.max) / 2;
const TID_SKALA = TID_SPAN / Math.max(1, TID.max - TID.min);
const xForAar = (aar) => (aar - TID_MID) * TID_SKALA;
const erPlacerbar = (n) => typeof n.aar === 'number' && n.gruppe !== 'epoke';

/** Årstal skrevet som årstal: negative år får «f.Kr.» på. */
const aarsTekst = (aar) => (typeof aar !== 'number' ? '' : aar < 0 ? `${-aar} f.Kr.` : `${aar}`);
/** Et tidsrum; krydser det år 0, skrives begge sider af det. */
const aarsInterval = (a, b) => (typeof b !== 'number' ? aarsTekst(a)
  : a < 0 && b >= 0 ? `${aarsTekst(a)}–${b} e.Kr.` : `${aarsTekst(a)}–${aarsTekst(b)}`);
const aarKildeTekst = (kilde) => ({ værk:'efter det tidligste værk', fænomen:'efter det tidligste fænomen',
  tænker:'efter den tidligste tænker' }[kilde] || '');

// Placeringen regnes én gang pr. vinduesbredde. Rækkerne lægges i skærm-pixels
// (de flytter sig ikke når man zoomer), mens den vandrette tæthed måles ved
// indpasnings-zoom: der må to noder i samme række ikke ligge tættere end
// TID_MINDSTE_PX, for så ville de dække hinanden i oversigtsbilledet. Noder der
// ikke kan få en fri plads, lægges i den række hvor de generer mindst – zoomer
// man ind, skiller de sig alligevel, fordi markørerne har fast størrelse.
let tidPos = new Map();
function bygTidslinje() {
  const sIndpas = (0.92 * Math.max(320, W)) / TID_SPAN;
  const mindste = TID_MINDSTE_PX / sIndpas;
  const baneIx = Object.fromEntries(TID_BANER.map((b, i) => [b.gruppe, i]));
  const rækker = TID_BANER.map(() => [[]]);
  const placerbare = nodes.filter(erPlacerbar)
    .sort((a, b) => (a.aar - b.aar) || String(a.id).localeCompare(String(b.id)));
  const pos = new Map();
  for (const n of placerbare) {
    const li = baneIx[n.gruppe];
    if (li === undefined) continue;
    const x = xForAar(n.aar);
    const afstand = (ri) => { const brugte = rækker[li][ri] || [];
      return brugte.length ? Math.min(...brugte.map((v) => Math.abs(v - x))) : Infinity; };
    let ri = 0;
    for (let k = 1; k <= TID_MAKS_RAEKKE; k += 1) {
      if (!rækker[li][k]) rækker[li][k] = [];
      if (!rækker[li][k * 2]) rækker[li][k * 2] = [];
    }
    if (afstand(0) < mindste) {                       // find den mindst dårlige række
      let bedst = 1;
      for (let k = 1; k <= TID_MAKS_RAEKKE * 2; k += 1) {
        if (!rækker[li][k]) rækker[li][k] = [];
        if (afstand(k) >= mindste) { bedst = k; break; }
        if (afstand(k) > afstand(bedst)) bedst = k;
      }
      ri = bedst;
    }
    rækker[li][ri].push(x);
    const forskydning = ri === 0 ? 0 : Math.ceil(ri / 2) * (ri % 2 ? -1 : 1) * TID_RAEKKE_PX;
    pos.set(n.id, { x, y: TID_BANER[li].y + forskydning });
  }
  tidPos = pos;
}
// Kaldes fra opstarten og fra resize(), fordi rækkeafstanden afhænger af
// vinduesbredden (ikke af zoom).

// Skærmkoordinater i tidslinjen (yaw/pitch er låst, så årstallet ligger fast på
// x-aksen uanset hvordan man har drejet universet før).
const tidSkala = () => FOV / state.dist;
const sxForVerdensX = (x) => CX + x * tidSkala() + state.panX;
const sxForAar = (aar) => sxForVerdensX(xForAar(aar));
// Lodret står banerne fast på skærmen, uanset hvor langt man zoomer ind.
const tidTopY = () => CY + TID_TOP_PX + state.panY;
const tidBundY = () => CY + TID_BUND_PX + state.panY;
const tidAkseY = () => CY + TID_AKSE_PX + state.panY;
const tidBaneY = (bane) => CY + bane + state.panY;

const norm = (s) => String(s).toLowerCase()
  .replace(/æ/g,'ae').replace(/ø/g,'o').replace(/å/g,'aa').replace(/é|è|ê/g,'e').replace(/ä/g,'a').replace(/ö/g,'o').replace(/ü/g,'u')
  .replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();

const nameIndex = new Map();  // alias -> [id, …] i gruppe-prioritetsrækkefølge
// Et alias kan ramme flere noder: filmen «Hannah Arendt» bærer samme titel som
// filosoffen. Filosoffer registreres først, så et personnavn peger på personen;
// filmen kan stadig findes via aliaset «hannah arendt film».
const GROUP_PRIORITY = { filosof:0, begreb:1, artefakt:2, epoke:3 };
function alias(name, id) {
  const k = norm(name);
  if (!k || k.length < 3) return;
  const arr = nameIndex.get(k);
  if (!arr) nameIndex.set(k, [id]);
  else if (!arr.includes(id)) arr.push(id);
}
for (const n of [...nodes].sort((x, y) => (GROUP_PRIORITY[x.gruppe] ?? 9) - (GROUP_PRIORITY[y.gruppe] ?? 9))) {
  alias(n.navn, n.id);
  if (n.en && n.en !== n.navn) alias(n.en, n.id);
  alias(n.ren.replace(/-/g,' '), n.id);
}
const aliasList = [...nameIndex.keys()].sort((a,b) => b.length - a.length);

// ── Tilstand ────────────────────────────────────────────────────────────────
const state = {
  mode:'alt',
  groups:{ filosof:true, begreb:true, artefakt:true, epoke:false },
  // Hvilke grader der vises som kanter; slås til og fra i tegnforklaringen.
  evidens:{ ...GRADE_ALLE_ON },
  sel:null, hover:null, path:null, focus:null,
  yaw:0.5, pitch:-0.28, dist:2300, panX:0, panY:0,
  highlighting:null,
};
let vis = [], visLinks = [];

const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d');
let W = 1, H = 1, DPR = 1, CX = 0, CY = 0, FOV = 900;

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W*DPR); canvas.height = Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  CX = W/2; CY = H/2;
  if (state.mode === 'tidslinje') bygTidslinje();
}
// Vigtigt: resize() kaldes også fra render-løkken. Visse webviews (og faner der
// åbnes i baggrunden) har 0×0 viewport i det øjeblik scriptet kører, og så
// fyrer resize-eventet aldrig bagefter – canvas'en ville stå fast på 0×0.
function ensureSize() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  if (window.innerWidth !== W || window.innerHeight !== H || dpr !== DPR) resize();
}
window.addEventListener('resize', resize);

// ── Planeter: procedurel tekstur + rigtigt billede ──────────────────────────
const SPRITE = 112;
const spriteCache = new Map();
const imageCache = new Map();
const hash = (s) => { let h = 2166136261; for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
const rngFrom = (s) => { let x = hash(s); return () => { x ^= x<<13; x>>>=0; x ^= x>>17; x ^= x<<5; x>>>=0; return x/4294967296; }; };

function drawProcedural(c, size, node) {
  const r = rngFrom(node.id);
  const base = COLORS[node.gruppe] || '#888';
  const hueShift = Math.floor(r()*70 - 35);
  const g = c.createRadialGradient(size*0.36, size*0.32, size*0.04, size*0.5, size*0.5, size*0.5);
  g.addColorStop(0, shade(base, 34 + hueShift));
  g.addColorStop(0.55, shade(base, -6 + hueShift));
  g.addColorStop(1, shade(base, -58));
  c.save();
  c.beginPath(); c.arc(size/2, size/2, size*0.47, 0, 6.2832); c.clip();
  c.fillStyle = g; c.fillRect(0,0,size,size);
  // Bælter eller kontinenter
  const bands = 3 + Math.floor(r()*5);
  c.globalAlpha = 0.16;
  for (let i=0;i<bands;i++) {
    const y = size*(0.15 + r()*0.7);
    c.fillStyle = shade(base, 40 - Math.floor(r()*90));
    c.beginPath();
    c.ellipse(size*(0.2+r()*0.6), y, size*(0.18+r()*0.4), size*(0.03+r()*0.07), (r()-0.5)*0.5, 0, 6.2832);
    c.fill();
  }
  c.globalAlpha = 1;
  c.restore();
  return c;
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const cl = (v) => Math.max(0, Math.min(255, v));
  const rr = cl(((n>>16)&255) + amt), gg = cl(((n>>8)&255) + amt), bb = cl((n&255) + amt);
  return `rgb(${rr},${gg},${bb})`;
}

function makeSprite(node) {
  const c = document.createElement('canvas');
  c.width = SPRITE; c.height = SPRITE;
  const g = c.getContext('2d');
  const R = SPRITE*0.42;

  // Glød
  const glow = g.createRadialGradient(SPRITE/2, SPRITE/2, R*0.85, SPRITE/2, SPRITE/2, SPRITE/2);
  glow.addColorStop(0, hexA(COLORS[node.gruppe]||'#888', 0.34));
  glow.addColorStop(1, hexA(COLORS[node.gruppe]||'#888', 0));
  g.fillStyle = glow; g.fillRect(0,0,SPRITE,SPRITE);

  // Kugle
  g.save();
  g.beginPath(); g.arc(SPRITE/2, SPRITE/2, R, 0, 6.2832); g.clip();
  const img = node.billede ? getImage(node) : null;
  if (img && img.complete && img.naturalWidth) {
    // Beskær billedet kvadratisk, centreret
    const s = Math.min(img.naturalWidth, img.naturalHeight);
    g.drawImage(img, (img.naturalWidth-s)/2, (img.naturalHeight-s)/2, s, s, SPRITE/2-R, SPRITE/2-R, R*2, R*2);
    // Let mørk tone i kanten, så fotos også bliver kugler
    const sh = g.createRadialGradient(SPRITE*0.36, SPRITE*0.33, R*0.1, SPRITE/2, SPRITE/2, R);
    sh.addColorStop(0,'rgba(255,255,255,.16)');
    sh.addColorStop(0.6,'rgba(0,0,0,0)');
    sh.addColorStop(1,'rgba(0,0,0,.62)');
    g.fillStyle = sh; g.fillRect(0,0,SPRITE,SPRITE);
  } else {
    const inner = document.createElement('canvas');
    inner.width = inner.height = Math.round(R*2);
    drawProcedural(inner.getContext('2d'), inner.width, node);
    g.drawImage(inner, SPRITE/2-R, SPRITE/2-R);
  }
  g.restore();

  // Kant + lysrefleks
  g.beginPath(); g.arc(SPRITE/2, SPRITE/2, R, 0, 6.2832);
  g.strokeStyle = hexA(COLORS[node.gruppe]||'#888', 0.55); g.lineWidth = 1.5; g.stroke();
  return c;
}

function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}

function getImage(node) {
  if (imageCache.has(node.id)) return imageCache.get(node.id);
  const img = new Image();
  img.decoding = 'async';
  img.onload = () => { spriteCache.delete(node.id); spriteCache.set(node.id, makeSprite(node)); };
  img.onerror = () => { img.dataset.failed = '1'; };
  img.src = IMG_DIR + node.billede;
  imageCache.set(node.id, img);
  return img;
}

function sprite(node) {
  let s = spriteCache.get(node.id);
  if (!s) { s = makeSprite(node); spriteCache.set(node.id, s); }
  return s;
}

// ── Synlige noder ───────────────────────────────────────────────────────────
function computeVisible() {
  if (state.mode === 'tidslinje') {
    vis = nodes.filter(n => erPlacerbar(n) && state.groups[n.gruppe]);
    const tidsSet = new Set(vis.map(n => n.id));
    visLinks = links.filter(l => tidsSet.has(l.kilde) && tidsSet.has(l.maal)
      && state.evidens[l.evidens] !== false);
    return;
  }
  if (state.mode === 'filosof') vis = nodes.filter(n => n.gruppe === 'filosof');
  else if (state.mode === 'begreb') vis = nodes.filter(n => n.gruppe === 'filosof' || n.gruppe === 'begreb');
  else vis = nodes.filter(n => state.groups[n.gruppe]);
  const set = new Set(vis.map(n => n.id));
  const allow = state.mode === 'filosof' ? new Set(['INFLUENCED'])
    : state.mode === 'begreb' ? new Set(['INFLUENCED','INVENTED','DEVELOPED','REVISED','CRITIQUED','FOUNDED','MEMBER_OF','DEVELOPS_FROM'])
    : null;
  visLinks = links.filter(l => set.has(l.kilde) && set.has(l.maal) && (!allow || allow.has(l.type))
    && state.evidens[l.evidens] !== false);
}

// ── 3D-projektion ───────────────────────────────────────────────────────────
const cosY = () => Math.cos(state.yaw), sinY = () => Math.sin(state.yaw);
const cosP = () => Math.cos(state.pitch), sinP = () => Math.sin(state.pitch);

// I tidslinjen kommer positionen fra bygTidslinje() i stedet for det indbagte
// 3D-layout, og kameraet er låst fladt, så årstallet står fast på x-aksen.
function project(n) {
  // Tidslinjen er et diagram og går uden om perspektivet: x zoomer med årene,
  // y er baner og rækker i faste skærm-pixels.
  if (state.mode === 'tidslinje') {
    const v = tidPos.get(n.id);
    if (!v) return null;
    const s = tidSkala();
    return { sx: CX + v.x * s + state.panX, sy: CY + v.y + state.panY, s, z: 1000 };
  }
  const cy = cosY(), sy = sinY(), cp = cosP(), sp = sinP();
  let x = n.x * cy + n.z * sy;
  let z = -n.x * sy + n.z * cy;
  let y = n.y * cp - z * sp;
  z = n.y * sp + z * cp;
  z += state.dist;
  if (z < 40) return null;
  const s = FOV / z;
  return { sx: CX + x*s + state.panX, sy: CY + y*s + state.panY, s, z };
}

// ── Rendering ───────────────────────────────────────────────────────────────
// Markørstørrelse: i universet vokser planeterne med zoom, men på tidslinjen
// holder de fast størrelse – ellers ville zoom ikke skille de tætte årtier.
function spriteRadius(n, p) {
  if (state.mode === 'tidslinje') return n.gruppe === 'filosof' ? 7.5 : n.gruppe === 'begreb' ? 6.5 : 6;
  return Math.max(0.6, Math.min(26, (n.gruppe === 'filosof' ? 11 : n.gruppe === 'begreb' ? 9 : 8) * p.s * 1.35));
}

const BANE_NAVN = { filosof:'Filosoffer', begreb:'Begreber', artefakt:'Artefakter' };
// Årstal på skærmen → hvilket år der står der. Bruges til at vide hvad der er
// inden for billedet, så der hverken tegnes stråler eller årstal udenfor.
const aarVedSkærmX = (px) => TID_MID + (px - CX - state.panX) / (tidSkala() * TID_SKALA);
const aarTrin = (visÅr) => (visÅr > 1600 ? 500 : visÅr > 800 ? 250 : visÅr > 400 ? 100
  : visÅr > 160 ? 50 : visÅr > 60 ? 25 : 10);

// Epokebåndene og århundredestrålerne ligger bag noderne og giver tidslinjen
// den ramme man læser årstal i.
function drawTidslinjeBaggrund() {
  const top = tidTopY(), bund = tidBundY();
  // Epokebåndene styres af «Epoker»-afkrydsningen som alle andre epoker; den
  // tændes automatisk når man går til tidslinjen, fordi båndene er dens ramme.
  const epoker = state.groups.epoke
    ? nodes.filter(n => n.gruppe === 'epoke' && typeof n.start === 'number').sort((a, b) => a.start - b.start)
    : [];
  let n = 0;
  for (const e of epoker) {
    const x1 = sxForAar(e.start), x2 = sxForAar(typeof e.end === 'number' ? e.end : e.start);
    if (x2 < -40 || x1 > W + 40) continue;
    ctx.fillStyle = n++ % 2 ? 'rgba(96,126,196,.06)' : 'rgba(150,126,220,.05)';
    ctx.fillRect(x1, top, Math.max(1, x2 - x1), bund - top);
  }
  // Epokenavne på båndene, så langt der er plads til dem.
  ctx.font = '600 11px "Segoe UI",sans-serif';
  ctx.fillStyle = 'rgba(150,172,218,.52)';
  const brugteNavne = [];
  for (const e of epoker) {
    const x1 = sxForAar(e.start), x2 = sxForAar(typeof e.end === 'number' ? e.end : e.start);
    const w = ctx.measureText(e.navn).width;
    if (x2 - x1 < w + 18 || x1 > W + 40 || x2 < -40) continue;
    const x = x1 + 8;
    if (brugteNavne.some(b => x < b.x + b.w && x + w > b.x)) continue;
    brugteNavne.push({ x, w });
    ctx.fillText(e.navn, x, top + 16);
  }
  const fraÅr = aarVedSkærmX(0), tilÅr = aarVedSkærmX(W);
  const trin = aarTrin(tilÅr - fraÅr);
  ctx.strokeStyle = 'rgba(120,150,210,.10)';
  ctx.lineWidth = 1;
  for (let aar = Math.ceil(fraÅr / trin) * trin; aar <= tilÅr; aar += trin) {
    const x = sxForAar(aar);
    ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, bund); ctx.stroke();
  }
}

// Årstalsaksen med ticks og banenavne tegnes oven på noderne, så den kan læses.
function drawTidslinjeAkse() {
  const fraÅr = aarVedSkærmX(0), tilÅr = aarVedSkærmX(W);
  const trin = aarTrin(tilÅr - fraÅr);
  const y = tidAkseY();
  ctx.strokeStyle = 'rgba(150,180,235,.5)';
  ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  ctx.font = '11px "Segoe UI",sans-serif';
  ctx.fillStyle = 'rgba(186,204,236,.78)';
  ctx.textAlign = 'center';
  for (let aar = Math.ceil(fraÅr / trin) * trin; aar <= tilÅr; aar += trin) {
    const x = sxForAar(aar);
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 6); ctx.stroke();
    ctx.fillText(aarsTekst(aar), x, y + 20);
  }
  ctx.textAlign = 'left';
  ctx.font = '11.5px "Segoe UI",sans-serif';
  for (const b of TID_BANER) {
    ctx.fillStyle = hexA(COLORS[b.gruppe], .75);
    ctx.fillText(BANE_NAVN[b.gruppe], 10, tidBaneY(b.y));
  }
}

// Et navn tegnes kun hvis der er plads til det. Rækkefølgen er de vigtige
// først (valgt node, hover, sti), derefter de nærmeste, og et navn springes over
// hvis det ville ligge oven i et andet. Så dukker teksten først op i takt med at
// zoom og spredning giver plads – aldrig oven i hinanden.
const måltBredde = new Map(); // »font|tekst« -> bredde, så vi ikke måler hver frame
function tekstBredde(font, tekst) {
  const nøgle = font + '|' + tekst;
  let w = måltBredde.get(nøgle);
  if (w === undefined) { ctx.font = font; w = ctx.measureText(tekst).width; måltBredde.set(nøgle, w); }
  return w;
}
function tegnNavne(labels) {
  const brugte = [];
  labels.sort((a, b) => (b.vigtig - a.vigtig) || (a.z - b.z) || (a.x - b.x));
  for (const l of labels) {
    const w = tekstBredde(l.font, l.tekst);
    const x = l.x, y = l.y - 11, h = 14;
    let fri = true;
    for (const b of brugte) {
      if (x < b.x + b.w && x + w + 2 > b.x && y < b.y + b.h && y + h > b.y) { fri = false; break; }
    }
    if (!fri) continue;
    brugte.push({ x, y, w: w + 2, h });
    ctx.font = l.font;
    ctx.fillStyle = l.farve;
    ctx.fillText(l.tekst, l.x, l.y);
  }
}

function render() {
  ctx.clearRect(0,0,W,H);
  drawStars();
  if (state.mode === 'tidslinje') drawTidslinjeBaggrund();

  const sel = state.sel ? byId.get(state.sel) : null;
  const hl = state.highlighting;
  const pathSet = new Set(state.path || []);
  const nbr = new Set();
  if (sel) for (const e of [...out.get(sel.id), ...inn.get(sel.id)]) nbr.add(e.id);

  const P = new Map();
  for (const n of vis) { const p = project(n); if (p) P.set(n.id, p); }

  // Kanter
  const pathEdges = new Set();
  if (state.path) for (let i=0;i<state.path.length-1;i++) {
    pathEdges.add(state.path[i]+'|'+state.path[i+1]);
    pathEdges.add(state.path[i+1]+'|'+state.path[i]);
  }
  ctx.lineWidth = 1;
  for (const l of visLinks) {
    const a = P.get(l.kilde), b = P.get(l.maal);
    if (!a || !b) continue;
    const isPath = pathEdges.has(l.kilde+'|'+l.maal);
    const hot = sel && (l.kilde === sel.id || l.maal === sel.id);
    const g = EVIDENS_FARVE[l.evidens] ? l.evidens : 'katalog';
    if (isPath) { ctx.setLineDash([]); ctx.strokeStyle = hexA('#ffd479', .95); ctx.lineWidth = 2.6; }
    else {
      // Stiplet kant = forbindelse uden en kilde, der belægger netop den kant.
      ctx.setLineDash(EVIDENS_STIPL[g] || []);
      ctx.strokeStyle = hexA(EVIDENS_FARVE[g], hot ? Math.min(.95, EVIDENS_ALFA[g] + .45) : EVIDENS_ALFA[g]);
      ctx.lineWidth = hot ? EVIDENS_BREDDE[g] + .8 : EVIDENS_BREDDE[g];
    }
    ctx.beginPath(); ctx.moveTo(a.sx, a.sy); ctx.lineTo(b.sx, b.sy); ctx.stroke();
  }
  ctx.setLineDash([]);

  // Noder, sorteret bagfra og frem
  const ordered = vis.filter(n => P.has(n.id)).sort((x,y) => P.get(y.id).z - P.get(x.id).z);
  const labels = [];
  for (const n of ordered) {
    const p = P.get(n.id);
    const onPath = pathSet.has(n.id);
    const dim = (sel && n.id !== sel.id && !nbr.has(n.id)) || (hl && !hl.has(n.id) && !onPath);
    const base = spriteRadius(n, p);
    const r = onPath ? base*1.5 : n.id === state.sel ? base*1.45 : base;
    ctx.globalAlpha = dim ? 0.16 : (p.z > 2400 ? 0.55 : 1);
    ctx.drawImage(sprite(n), p.sx - r, p.sy - r, r*2, r*2);
    ctx.globalAlpha = 1;
    const vigtig = onPath || n.id === state.sel || n.id === state.hover;
    if (!dim) {
      const font = vigtig ? '600 12.5px "Segoe UI",sans-serif' : '11.5px "Segoe UI",sans-serif';
      const farve = onPath ? '#ffd479' : (n.id === state.sel ? '#ffffff' : 'rgba(215,228,250,.88)');
      const label = n.navn.length > 34 ? n.navn.slice(0,33)+'…' : n.navn;
      // Navnene samles og skrives bagefter, så de kan fordeles efter plads i
      // stedet for at ligge oven i hinanden (se tegnNavne). I tidslinjen står
      // markørerne fast i skærm-pixels, i universet skalerer de med zoom.
      labels.push({ tekst:label, x:p.sx + r * (state.mode === 'tidslinje' ? 1 : 0.8) + 3, y:p.sy + 4, font, farve, vigtig, z:p.z });
    }
    if (n.id === state.sel) {
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(p.sx, p.sy, r+4.5, 0, 6.2832); ctx.stroke();
    }
  }
  tegnNavne(labels);
  if (state.mode === 'tidslinje') drawTidslinjeAkse();
  drawPathPulse(P);
}

const stars = (() => { const a = []; let x = 42; const r = () => { x = (x*1103515245+12345) & 0x7fffffff; return x/0x7fffffff; };
  for (let i=0;i<520;i++) a.push({ x:r(), y:r(), r:r()*1.25+0.25, a:r()*0.5+0.15, p:r()*6.2832 }); return a; })();
function drawStars() {
  const t = performance.now()/3200;
  for (const s of stars) {
    const tw = 0.55 + 0.45*Math.sin(t + s.p);
    ctx.globalAlpha = s.a*tw;
    ctx.fillStyle = '#cfe0ff';
    ctx.beginPath(); ctx.arc(s.x*W, s.y*H, s.r, 0, 6.2832); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

let pulse = 0;
function drawPathPulse(P) {
  if (!state.path || state.path.length < 2) return;
  const pts = state.path.map(id => P.get(id)).filter(Boolean);
  if (pts.length < 2) return;
  pulse = (pulse + 0.008) % 1;
  let total = 0; const seg = [];
  for (let i=0;i<pts.length-1;i++) { const d = Math.hypot(pts[i+1].sx-pts[i].sx, pts[i+1].sy-pts[i].sy); seg.push(d); total += d; }
  let target = pulse*total;
  for (let i=0;i<seg.length;i++) {
    if (target <= seg[i]) {
      const t = seg[i] ? target/seg[i] : 0;
      const x = pts[i].sx + (pts[i+1].sx-pts[i].sx)*t;
      const y = pts[i].sy + (pts[i+1].sy-pts[i].sy)*t;
      const g = ctx.createRadialGradient(x,y,0,x,y,16);
      g.addColorStop(0,'rgba(255,225,150,.95)'); g.addColorStop(1,'rgba(255,200,80,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x,y,16,0,6.2832); ctx.fill();
      break;
    }
    target -= seg[i];
  }
}

// ── Interaktion ─────────────────────────────────────────────────────────────
let drag = null, spd = { yaw:0, pitch:0 };
canvas.addEventListener('mousedown', (e) => {
  drag = { x:e.clientX, y:e.clientY, yaw:state.yaw, pitch:state.pitch, panX:state.panX, panY:state.panY, btn:e.button, moved:false };
  canvas.classList.add('drag');
});
window.addEventListener('mousemove', (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
  // På tidslinjen panorerer man i stedet for at dreje: aksen skal blive stående.
  if (drag.btn === 2 || state.mode === 'tidslinje') { state.panX = drag.panX + dx; state.panY = drag.panY + dy; return; }
  state.yaw = drag.yaw + dx*0.006;
  state.pitch = Math.max(-1.45, Math.min(1.45, drag.pitch + dy*0.006));
  spd.yaw = dx*0.00035; spd.pitch = dy*0.00035;
});
window.addEventListener('mouseup', (e) => {
  if (drag && !drag.moved && drag.btn === 0) {
    const n = pick(e.clientX, e.clientY);
    select(n ? n.id : null);
  }
  drag = null; canvas.classList.remove('drag');
});
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
// Zoom så det man peger på, bliver stående under musemarkøren. Uden dette
// ankrer zoomede universet mod midten af skærmen, og man måtte trække efter for
// hvert hjul-trin for at holde fast i det man var ved at se nærmere på.
function nærmesteNode(px, py, maks = 46) {
  let bedst = null, bedstD = maks;
  for (const n of vis) {
    const p = project(n); if (!p) continue;
    const d = Math.hypot(p.sx - px, p.sy - py);
    if (d < bedstD) { bedstD = d; bedst = n; }
  }
  return bedst;
}
function zoomModMarkør(px, py, nyDist) {
  if (state.mode === 'tidslinje') {
    // I tidslinjen skalerer kun x med zoom – banerne og rækkerne står fast i
    // skærm-pixels – så det er kun den vandrette akse, der skal ankres. Fulgt
    // det lodrette med, sprang hele diagrammet for hvert hjul-trin.
    const vx = (px - CX - state.panX) / tidSkala();
    state.dist = nyDist;
    state.panX = px - CX - vx * tidSkala();
    return;
  }
  // I universet er dybden perspektivisk. Ligger der en node under markøren,
  // ankres der på dens dybde, så netop den bliver stående præcist; ellers bruges
  // planet gennem origo (dybde = dist), som er et rimeligt bud midt i universet.
  const nabo = nærmesteNode(px, py);
  const cy = cosY(), sy = sinY(), cp = cosP(), sp = sinP();
  let xr, yr, zr;
  if (nabo) {
    const zRot = -nabo.x * sy + nabo.z * cy;
    xr = nabo.x * cy + nabo.z * sy;
    yr = nabo.y * cp - zRot * sp;
    zr = nabo.y * sp + zRot * cp;
  } else {
    const s0 = FOV / state.dist;
    xr = (px - CX - state.panX) / s0;
    yr = (py - CY - state.panY) / s0;
    zr = 0;
  }
  state.dist = nyDist;
  // Samme grænse som project(): noder tættere på end 40 tegnes ikke.
  const s2 = FOV / Math.max(40, zr + nyDist);
  state.panX = px - CX - xr * s2;
  state.panY = py - CY - yr * s2;
}
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const faktor = e.deltaY < 0 ? 0.9 : 1.111;
  const mindst = state.mode === 'tidslinje' ? 120 : 320;
  const ny = Math.max(mindst, Math.min(6000, state.dist * faktor));
  zoomModMarkør(e.clientX, e.clientY, ny);
}, { passive:false });
canvas.addEventListener('dblclick', (e) => {
  const n = pick(e.clientX, e.clientY);
  if (n) { state.focus = n.id; state.dist = Math.max(420, state.dist*0.8); select(n.id); }
});

function pick(cx, cy) {
  let best = null, bestZ = Infinity, bestD = Infinity;
  for (const n of vis) {
    const p = project(n); if (!p) continue;
    const d = Math.hypot(p.sx-cx, p.sy-cy);
    const rækkevidde = Math.max(spriteRadius(n, p), 9);
    if (d >= rækkevidde) continue;
    // På tidslinjen ligger noderne i samme plan, så nærmeste midte vinder.
    if (state.mode === 'tidslinje' ? d < bestD : p.z < bestZ) { best = n; bestZ = p.z; bestD = d; }
  }
  return best;
}

// Automatisk langsom rotation + blød kamera-indflyvning
function step() {
  ensureSize();
  if (W < 2 || H < 2) { requestAnimationFrame(step); return; }
  if (!drag && state.mode !== 'tidslinje') { state.yaw += 0.00035 + spd.yaw; state.pitch += spd.pitch; spd.yaw *= 0.94; spd.pitch *= 0.94;
    state.pitch = Math.max(-1.45, Math.min(1.45, state.pitch)); }
  if (state.focus) {
    const n = byId.get(state.focus);
    if (n) {
      // Drej kameraet hen mod noden og vip det let ned mod den.
      const want = Math.atan2(n.x, n.z) + 0.6;
      const delta = ((want - state.yaw + Math.PI*3) % (Math.PI*2)) - Math.PI;
      state.yaw += delta * 0.06;
      state.pitch += (-0.22 - state.pitch) * 0.06;
    }
  }
  render();
  requestAnimationFrame(step);
}

// ── Tidslinje-navigation ────────────────────────────────────────────────────
// Indpas hele spændet fra oldtiden til i dag.
function fitTidslinje() {
  bygTidslinje();
  state.yaw = 0; state.pitch = 0; state.panX = 0; state.panY = 0;
  state.dist = Math.max(300, Math.min(6000, (TID_SPAN * FOV) / Math.max(320, W * 0.92)));
}

// Zoom til et tidsrum – bruges af epokerne i svaret og af spørgsmål.
function zoomTilAar(aar1, aar2) {
  if (state.mode !== 'tidslinje') { state.mode = 'tidslinje'; syncUI(); }
  state.groups.epoke = true;
  const midt = (aar1 + aar2) / 2;
  const spænd = Math.max(1, TID.max - TID.min);
  const bredde = Math.max(40, Math.abs(aar2 - aar1) * 1.3);
  state.dist = Math.max(120, Math.min(6000, (TID_SPAN * FOV * bredde) / (0.92 * Math.max(320, W) * spænd)));
  state.panX = -xForAar(midt) * (FOV / state.dist);
  state.panY = 0;
  state.focus = null; state.path = null;
  computeVisible(); select(null);
}

// Vis en node på tidslinjen: skift visning, sæt året i midten og markér noden.
function visPåTidslinjen(id) {
  const n = byId.get(id);
  if (!n || !erPlacerbar(n)) return false;
  if (state.mode !== 'tidslinje') { state.mode = 'tidslinje'; syncUI(); }
  state.groups[n.gruppe] = true; state.groups.epoke = true;
  if (state.dist > 900) state.dist = 700;
  state.focus = null; state.path = null;
  computeVisible();
  const v = tidPos.get(n.id);
  // Kun vandret centrering: banerne står i faste skærm-pixels, så hele
  // diagrammet bliver stående i billedet.
  if (v) state.panX = -v.x * (FOV / state.dist);
  state.panY = 0;
  select(id);
  return true;
}

// ── Søgning ─────────────────────────────────────────────────────────────────
const qEl = document.getElementById('q'), hitsEl = document.getElementById('hits');
qEl.addEventListener('input', () => {
  const s = qEl.value.trim().toLowerCase();
  if (s.length < 2) { hitsEl.hidden = true; return; }
  const found = nodes.filter(n =>
    n.navn.toLowerCase().includes(s) || String(n.en||'').toLowerCase().includes(s)).slice(0,14);
  hitsEl.innerHTML = found.map(n => `<div data-id="${n.id}"><b>${esc(n.navn)}</b><span>${esc(GROUP_DA[n.gruppe])}</span></div>`).join('')
    || '<div style="padding:8px 11px;color:#8fa0c0">Intet fundet</div>';
  hitsEl.hidden = false;
  for (const el of hitsEl.querySelectorAll('[data-id]')) el.onclick = () => {
    flyTo(el.dataset.id); hitsEl.hidden = true; qEl.value = '';
  };
});
document.addEventListener('click', (e) => { if (!e.target.closest('.search')) hitsEl.hidden = true; });

function flyTo(id) {
  const n = byId.get(id);
  if (!n) return;
  if (state.mode === 'tidslinje') { visPåTidslinjen(id); return; }
  ensureVisible(n);
  state.focus = id; state.dist = Math.max(520, Math.min(state.dist, 1100));
  select(id);
}
function ensureVisible(n) {
  if (n.gruppe !== 'epoke') state.groups[n.gruppe] = true;
  if (state.mode !== 'alt' && state.mode !== 'tidslinje') state.mode = 'alt';
  syncUI(); computeVisible();
}

// ── Detaljepanel ────────────────────────────────────────────────────────────
const panel = document.getElementById('panel');
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Kilden bliver et link, når den er en URL. Nogle kanter har i stedet en fælles
// proveniens (fx «Wikipedia/Afledt af Raper 2012») – den må ikke blive et dødt
// link, så den vises som dæmpet tekst med den fulde tekst i værktøjstippet.
const kildeEl = (kilde) => {
  const s = String(kilde || '');
  if (!s) return '';
  return /^https?:\/\//.test(s)
    ? ` <a class="kilde" href="${esc(s)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">kilde ↗</a>`
    : ` <span class="prov" title="${esc(s)}">proveniens</span>`;
};

function select(id) {
  state.sel = id;
  renderPanel();
  // På tidslinjen centreres året med det samme (se visPåTidslinjen) – et
  // vedvarende fokus ville ellers trække billedet tilbage mens man panorerer.
  if (id && state.mode !== 'tidslinje') { const n = byId.get(id); if (n) state.focus = id; }
}

// Graden vises, hvor den siger noget ud over det sædvanlige: «belagt» har sit
// kildelink, og «katalog» er slet ikke en påstand om indflydelse. De svage led
// markeres, så man kan se dem mens man læser.
const evidensTag = (ev) => {
  const g = GRADE.get(ev);
  if (!g || ev === 'katalog' || ev === 'belagt') return '';
  return ` <span class="evtag" style="color:${EVIDENS_FARVE[ev]}" title="${esc(g.forklaring)}">${esc(g.kort || ev)}</span>`;
};

function relRow(e) {
  const o = byId.get(e.id); if (!o) return '';
  const pair = REL_DA[e.type];
  const label = pair ? (e.dir === 'in' ? pair[1] : pair[0]) : (e.dir === 'in' ? 'ind fra' : 'relateret til');
  // Kilde-linket må ikke udløse rækkens eget klik (der flyver kameraet til noden).
  const kilde = kildeEl(e.kildeURL);
  return `<div class="rel" data-goto="${e.id}"><i>${esc(label)}</i><b>${esc(o.navn)}</b>
    <span class="t">${esc(GROUP_DA[o.gruppe])}</span>${evidensTag(e.evidens)}${kilde}</div>`;
}

function renderPanel() {
  const n = state.sel ? byId.get(state.sel) : null;
  if (!n) { panel.classList.remove('open'); panel.innerHTML = ''; return; }
  const o = out.get(n.id) || [], i = inn.get(n.id) || [];
  const bits = [GROUP_DA[n.gruppe]];
  if (n.born || n.died) bits.push(`${n.born} – ${n.died}`);
  if (n.year) bits.push(`${n.year}`);
  // Begreber har ikke eget årstal; deres plads på tidslinjen er afledt, og det
  // står der, så placeringen ikke fremstår som en oplysning fra kilden.
  if (n.gruppe === 'begreb' && typeof n.aar === 'number') {
    bits.push(`≈ ${aarsTekst(n.aar)} (${aarKildeTekst(n.aarKilde) || 'afledt'})`);
  }
  // For filosoffer er `undertype` og `epoke` samme id, så uden dette stod epoken
  // to gange. Vi viser den i stedet med sit danske navn (fx «Oplysningstiden»).
  const eraNavn = (id) => { const e = id && byId.get('era:' + id); return e ? e.navn : null; };
  if (n.gruppe === 'filosof') {
    const era = eraNavn(n.epoke); if (era) bits.push(era);
  } else {
    if (n.undertype) bits.push(n.undertype === 'tradition' ? 'tradition' : (TYPE_DA[n.undertype] || n.undertype));
    if (n.epoke && n.epoke !== n.undertype) { const era = eraNavn(n.epoke); if (era) bits.push(era); }
  }
  const wiki = n.wiki
    ? `<a href="https://en.wikipedia.org/wiki/${encodeURIComponent(n.wiki)}" target="_blank" rel="noopener">Wikipedia ↗</a>`
    : n.billedeTitel ? `<span title="billedets artikel">billede: ${esc(n.billedeTitel)}</span>` : '';

  panel.innerHTML = `
    <button class="close" id="cl">×</button>
    ${n.billede ? `<img class="hero" src="${IMG_DIR}${esc(n.billede)}" alt="${esc(n.navn)}">`
      : `<div class="hero" style="display:grid;place-items:center;color:#5a6b88">genereret planet</div>`}
    <h2>${esc(n.navn)}</h2>
    <div class="meta">${bits.filter(Boolean).map(esc).join(' · ')} ${wiki}</div>
    ${n.note ? `<p class="note">${esc(n.note)}</p>` : ''}
    <div class="tools">
      <button id="pathA">Sæt som start</button>
      <button id="pathB">Sæt som slut</button>
      <button id="center">Centrér</button>
      ${erPlacerbar(n) ? '<button id="timeline">Vis på tidslinjen</button>' : ''}
    </div>
    ${o.length ? `<h3 class="sec">Udgående (${o.length})</h3>${o.map(relRow).join('')}` : ''}
    ${i.length ? `<h3 class="sec">Indgående (${i.length})</h3>${i.map(relRow).join('')}` : ''}
  `;
  panel.classList.add('open');
  panel.querySelector('#cl').onclick = () => select(null);
  panel.querySelector('#center').onclick = () => {
    if (state.mode === 'tidslinje') { visPåTidslinjen(n.id); return; }
    state.focus = n.id; state.dist = 700;
  };
  if (panel.querySelector('#timeline')) panel.querySelector('#timeline').onclick = () => visPåTidslinjen(n.id);
  panel.querySelector('#pathA').onclick = () => setEndpoint('A', n.id);
  panel.querySelector('#pathB').onclick = () => setEndpoint('B', n.id);
  for (const el of panel.querySelectorAll('[data-goto]')) el.onclick = () => flyTo(el.dataset.goto);
}

// ── Konceptuelle stier ──────────────────────────────────────────────────────
const ends = { A:null, B:null };
function setEndpoint(which, id) {
  ends[which] = id;
  const n = byId.get(id);
  showAnswer(`<h3>Sti-ende ${which} sat</h3>
    <div class="sub">${esc(n.navn)} · ${esc(GROUP_DA[n.gruppe])}
    ${ends.A && ends.B ? '' : '<br>Vælg en node mere og tryk «Find sti».'}</div>
    ${ends.A && ends.B ? '<div class="sub">Begge ender er sat – finder stien …</div>' : ''}`);
  if (ends.A && ends.B) findPath(ends.A, ends.B);
}

function bfs(from, to, skip) {
  if (from === to) return [from];
  const prev = new Map([[from, null]]);
  const queue = [from];
  while (queue.length) {
    const cur = queue.shift();
    for (const nb of UNDIR.get(cur) || []) {
      if (prev.has(nb)) continue;
      if (skip && skip.has(nb)) continue;
      prev.set(nb, cur);
      if (nb === to) {
        const path = [to]; let p = cur;
        while (p !== null) { path.unshift(p); p = prev.get(p); }
        return path;
      }
      queue.push(nb);
    }
  }
  return null;
}

// Epokerne er en bro, ikke en begrundelse: «levede i» og «efterfølges af»
// forbinder alt med alt og giver kedelige stier. Vi finder derfor først en sti
// gennem tænkere, begreber og artefakter og falder kun tilbage på epokerne,
// hvis der slet ikke er nogen forbindelse uden dem.
const EPOKER = new Set(DATA.nodes.filter(n => n.gruppe === 'epoke').map(n => n.id));

function findPath(a, b) {
  const path = bfs(a, b, EPOKER) || bfs(a, b);
  if (!path) { showAnswer('<h3>Ingen sti</h3><div class="sub">Der er ingen forbindelse i grafen.</div>'); return; }
  state.path = path;
  state.highlighting = new Set(path);
  state.mode = 'alt'; state.groups.filosof = true; state.groups.begreb = true; state.groups.artefakt = true;
  // En sti er en kæde af kanter af blandede evidensgrader: står kantfiltret på
  // fx kun «belagt», ville led i kæden mangle. Stien nulstiller derfor filtret,
  // ligesom den allerede tænder alle nodegrupper.
  state.evidens = { ...GRADE_ALLE_ON };
  renderEvidensUI();
  syncUI(); computeVisible();
  showAnswer(answerPath(path));
}

function answerPath(path) {
  const parts = [];
  for (let i=0;i<path.length;i++) {
    const n = byId.get(path[i]);
    parts.push(`<b data-goto="${path[i]}">${esc(n.navn)}</b>`);
    if (i < path.length-1) {
      const l = linkKey.get(path[i]+'|'+path[i+1]);
      const pair = l ? REL_DA[l.type] : null;
      const dir = l && l.kilde === path[i] ? (pair?pair[0]:l.type) : (pair?pair[1]:l.type);
      parts.push(`<em>${esc(dir || '')}→</em>`);
    }
  }
  const eds = [];
  for (let i=0;i<path.length-1;i++) { const l = linkKey.get(path[i]+'|'+path[i+1]); if (l) eds.push(l.type); }
  return `<h3>Konceptuel sti · ${path.length} noder, ${path.length-1} led</h3>
    <div class="sub">${[...new Set(eds)].map(t => REL_DA[t] ? REL_DA[t][0] : t).join(' · ')}<br>
    Stien er fremhævet i universet med en vandrende lysglimt.
    Alle grader vises undervejs, så hele kæden kan ses.</div>
    <div class="path">${parts.join(' ')}</div>`;
}

// ── Spørgsmålsmotor ─────────────────────────────────────────────────────────
const TYPES_DA = Object.fromEntries(Object.entries(TYPE_DA).map(([k,v]) => [norm(v), k]));
TYPES_DA['vaerk'] = null; TYPES_DA['vaerker'] = null; TYPES_DA['boeger'] = 'Book'; TYPES_DA['film'] = 'Film';

function entitiesIn(text) {
  const t = ' ' + norm(text) + ' ';
  // Person-spørgsmål («hvad skrev X?») skal ramme filosoffen – ikke filmen med samme navn.
  const person = /\b(skrev|skrevet|forfatter|opfandt|opfundet|fodt|levde|hvem|filosof)\b/.test(t);
  const found = [];
  const used = [];
  for (const a of aliasList) {
    if (a.length < 4) continue;
    const idx = t.indexOf(' ' + a + ' ');
    if (idx === -1) continue;
    if (used.some(u => idx < u.end && idx + a.length > u.start)) continue;
    used.push({ start: idx, end: idx + a.length + 1 });
    const ids = nameIndex.get(a) || [];
    const id = (person && ids.find(x => byId.get(x) && byId.get(x).gruppe === 'filosof')) || ids[0];
    if (id && !found.includes(id)) found.push(id);
    if (found.length >= 3) break;
  }
  return found;
}

function wantsType(text) {
  const t = norm(text);
  for (const [da, type] of Object.entries(TYPES_DA)) {
    if (new RegExp('\\b' + da + '(er|e|s)?\\b').test(t)) return type;
  }
  return undefined;
}

function answerList(head, sub, rows, empty) {
  if (!rows.length) return `<h3>${esc(head)}</h3><div class="sub">${esc(sub)}</div><div class="none">${esc(empty)}</div>`;
  return `<h3>${esc(head)}</h3><div class="sub">${esc(sub)}</div>${rows.join('')}`;
}
// kilde (valgfrit) er den URL, kanten bygger på – den vises som et lille link,
// så et svar kan efterprøves uden at forlade universet. En kanprops fælles
// proveniens vises i stedet som tekst, så den ikke bliver et dødt link.
const kildeLink = kildeEl;
const rowFor = (node, label, type, kilde, evidens) => `<div class="row" data-goto="${node.id}"><i>${esc(label)}</i>
  <b>${esc(node.navn)}</b><span class="t">${esc(type || GROUP_DA[node.gruppe])}</span>${evidensTag(evidens)}${kildeLink(kilde)}</div>`;

// Verbum → hvilke relationstyper, og hvilken retning spørgsmålet peger.
// Regexerne er præfikser, så bøjninger som «udspringer» og «videreudviklede»
// også rammer. Bemærk at norm() skriver æ/ø/å om til ae/o/aa.
const VERBS = [
  { re:/\b(kritiser|kritis|kritik|afvis|modsagde|imodegik)/, ud:['CRITIQUED'], ind:['CRITIQUED'] },
  { re:/\b(videreudvikl|udvikl|forandrede|forandre|omarbejd|revider|aendr)/, ud:['DEVELOPED','REVISED'], ind:['DEVELOPED','REVISED'] },
  { re:/\b(opfandt|opfund|opfind|opdage|grundlag|stift|skab)/, ud:['INVENTED','FOUNDED'], ind:['INVENTED','FOUNDED'] },
  { re:/\b(paavirk|inspir|influ|bygger pa)/, ud:['INFLUENCED'], ind:['INFLUENCED'] },
  { re:/\b(skrev|skrevet|forfattede|forfatter|udgav|udgivet)/, ud:['AUTHORED','CREATED'], ind:['AUTHORED','CREATED'] },
  { re:/\b(udspring|ophav|kommer fra|forer til|gav)/, ud:['GAVE_RISE_TO','EXPRESSED_IN'], ind:['GAVE_RISE_TO','EXPRESSED_IN'] },
  { re:/\b(medlem|tilhorte|del af)/, ud:['MEMBER_OF'], ind:['MEMBER_OF'] },
];
const relLabel = (type, dir) => { const p = REL_DA[type]; return p ? p[dir === 'in' ? 1 : 0] : type; };
// Alle måder en node kan pege på et artefakt. AUTHORED/CREATED tælles med, så
// «hvilke bøger er knyttet til Kant?» ikke svarer at han ingen har.
const ARTEFAKT_REL = ['GAVE_RISE_TO', 'EXPRESSED_IN', 'AUTHORED', 'CREATED'];
// «ingen film», «ingen bog» – ental er korrekt dansk for en typebetegnelse.
const lavOrd = (type) => (type ? (TYPE_DA[type] || type) : 'relationer').toLowerCase();

// ── Evidensgrader i spørgsmål ───────────────────────────────────────────────
// Regexerne kører på norm()-teksten, hvor æ/ø/å er skrevet om til ae/o/aa.
const EVIDENS_ORD = [
  { id:'belagt', re:/\b(belagt|belagte|kildebelagt|dokumenteret|dokumenterede|underbygget)/ },
  { id:'afledt', re:/\b(afledt|afledte|udledt|udledte|raper)/ },
  { id:'slaegtskab', re:/\b(slaegtskab|udokumenteret|udokumenterede|bredt|svag|svage|usikker|usikre)/ },
  { id:'katalog', re:/\b(katalog|katalogfaktum|katalogfakta|optegnelse|optegnelser)/ },
];
const NAEVNER_EVIDENS = /\b(evidens|evidensgrad|evidensgrader|belagt|belagte|dokumenteret|dokumenterede|slaegtskab|afledt|afledte|katalogfaktum|udokumenteret)\b/;

function evidensSvar(ids) {
  state.evidens = Object.fromEntries(GRADE_IDS.map(id => [id, ids.includes(id)]));
  computeVisible(); renderEvidensUI();
  const antal = DATA.meta.evidensFordeling || {};
  const total = links.length || 1;
  const pct = (n) => `${(100*n/total).toFixed(1).replace('.', ',')} %`;
  const rows = GRADE_IDS.map(id => {
    const g = GRADE.get(id);
    return `<div class="row" data-ev="${esc(id)}" title="${esc(g.forklaring)}">`
      + `<i style="color:${EVIDENS_FARVE[id]}">▬▬</i><b>${esc(g.da)}${ids.includes(id) ? ' ✓' : ''}</b>`
      + `<span class="t">${antal[id] || 0} kanter · ${pct(antal[id] || 0)}</span></div>`;
  }).join('');
  const valgt = GRADE_IDS.filter(id => ids.includes(id)).map(id => GRADE.get(id).da);
  return `<h3>Kanter efter evidens</h3>
    <div class="sub">${total} kanter · vist nu: ${esc(valgt.join(', ') || 'ingen')}
    <br>Klik en grad for at filtrere universet til den – «alle» viser dem igen.</div>
    ${rows}<div class="row" data-ev="alle"><i>↺</i><b>Vis alle grader</b></div>`;
}

function answerQuery(text) {
  const t = norm(text);
  const ents = entitiesIn(text);
  const type = wantsType(text);

  // 0) Spørgsmål om hvor godt grafen er belagt.
  if (NAEVNER_EVIDENS.test(t)) {
    const ids = EVIDENS_ORD.filter(o => o.re.test(t)).map(o => o.id);
    return evidensSvar(ids.length ? ids : GRADE_IDS);
  }

  // 0b) Tidslinjen: «vis tidslinjen», «hvornår levede Kant?»
  if (/\b(tidslinje|tidslinjen|tidsakse|kronologisk|kronologi|hvornaar)\b/.test(t)) {
    if (ents.length && byId.has(ents[0]) && visPåTidslinjen(ents[0])) {
      const a = byId.get(ents[0]);
      const hvad = a.gruppe === 'filosof'
        ? `levede ${aarsInterval(a.aar, a.aarSlut)}`
        : a.gruppe === 'begreb' ? `placeret ved ${aarsTekst(a.aar)} – ${aarKildeTekst(a.aarKilde) || 'afledt'}`
        : `${aarsTekst(a.aar)}`;
      const epoke = a.epoke && byId.get('era:' + a.epoke) ? byId.get('era:' + a.epoke).navn : '';
      // Naboerne i tid i samme bane: hvad stod der lige før og efter?
      const bane = vis.filter(x => x.gruppe === a.gruppe).sort((x, y) => x.aar - y.aar);
      const ix = bane.findIndex(x => x.id === a.id);
      const nabo = (k) => (bane[ix + k] ? rowFor(bane[ix + k], k < 0 ? 'før i tid' : 'efter i tid', '', '') : '');
      return answerList(`${a.navn} på tidslinjen`,
        `${hvad}${epoke ? ' · ' + epoke : ''}<br>Samme bane viser ${bane.length} ${(BANE_NAVN[a.gruppe] || '').toLowerCase()}, ordnet efter år.`,
        [nabo(-1), nabo(1)].filter(Boolean), 'Ingen naboer i samme bane.');
    }
    if (state.mode !== 'tidslinje') { state.mode = 'tidslinje'; syncUI(); fitTidslinje(); }
    state.groups.epoke = true; syncUI(); computeVisible();
    const epoker = nodes.filter(n => n.gruppe === 'epoke' && typeof n.start === 'number').sort((a, b) => a.start - b.start);
    const rækker = epoker.map(e => {
      const slut = typeof e.end === 'number' ? e.end : e.start;
      const iEpoke = nodes.filter(n => erPlacerbar(n) && n.aar >= e.start && n.aar <= slut);
      // Tæthed i stedet for andel: epokerne overlapper (klassisk Kina løber ved
      // siden af antikken, og de moderne epoker griber ind i hinanden), så en
      // procentdel ville lægge sig sammen til langt over 100.
      const tæthed = Math.round((100 * iEpoke.length) / Math.max(1, slut - e.start));
      return `<div class="row" data-aar="${e.start}|${slut}" title="Zoom til ${esc(e.navn)}">`
        + `<i>${esc(aarsInterval(e.start, slut))}</i><b>${esc(e.navn)}</b>`
        + `<span class="t">${iEpoke.length} noder · ${tæthed} pr. 100 år</span></div>`;
    });
    return `<h3>Tidslinjen · ${TID.antal} noder fra ${aarsTekst(TID.min)} til ${aarsTekst(TID.max)}</h3>
      <div class="sub">Årstallet er x-aksen: filosoffer, begreber og artefakter har hver sin bane, epokerne ligger som bånd bagved.
      ${TID.begreberEfter ? `De ${TID.begreberEfter.værk + TID.begreberEfter.fænomen + TID.begreberEfter.tænker} begreber har ikke eget årstal – deres plads er <b>afledt</b> (${TID.begreberEfter.værk} efter værk, ${TID.begreberEfter.fænomen} efter fænomen, ${TID.begreberEfter.tænker} efter tænker).` : ''}
      <br>Træk for at panorere, rul for at zoome om markøren. Klik en epoke herunder for at zoome til den.</div>
      ${rækker.join('')}`;
  }

  // 1) Sti mellem to noder
  if (/\b(sti|stien|vej|forbind|forbundet|kæde|kaede|path)\b/.test(t) && ents.length >= 2) {
    findPath(ents[0], ents[1]);
    return '';
  }

  if (/\b(sti|stien|vej|vejen|path)\b/.test(t) && ents.length < 2) {
    return answerList('Find en sti',
      'Nævn to noder, fx «find stien fra Platon til Nietzsche», eller brug «Sæt som start»/«slut» i panelet.', [], '');
  }

  if (!ents.length) {
    return answerList('Det forstod jeg ikke',
      'Prøv fx «hvad opfandt Kant?», «hvem kritiserede Platon?», «hvilke film udspringer af nihilisme?» '
      + 'eller «find stien fra Thales til Kant».', [], '');
  }

  const a = byId.get(ents[0]);
  // «hvilke film udspringer af marxisme?» → filter kun på den ønskede artefakttype
  const passType = (e) => !type || byId.get(e.id).undertype === type;
  const rowsOf = (list) => list.filter(passType)
    .map(e => rowFor(byId.get(e.id), relLabel(e.type, e.dir),
      TYPE_DA[byId.get(e.id).undertype] || GROUP_DA[byId.get(e.id).gruppe], e.kildeURL, e.evidens));

  // 2) Verbumstyrede spørgsmål: «hvem kritiserede X?» (ind i grafen),
  //    «hvilke begreber videreudviklede X?» (ud af grafen).
  const verb = VERBS.find(v => v.re.test(t));
  const hvem = /\bhvem\b/.test(t);
  if (verb) {
    const dir = hvem ? 'in' : 'ud';
    const types = dir === 'in' ? verb.ind : verb.ud;
    const rows = rowsOf((dir === 'in' ? inn.get(a.id) : out.get(a.id) || []).filter(e => types.includes(e.type)));
    if (rows.length) {
      return answerList(
        hvem ? `Hvem – ${a.navn}` : `Hvad ${a.navn} står bag`,
        `${a.navn} · ${GROUP_DA[a.gruppe]}${type ? ' · kun ' + (TYPE_DA[type] || type).toLowerCase() : ''}`,
        rows,
        `Ingen ${lavOrd(type)} fundet for ${a.navn}.`);
    }
    // To led: «hvad gav Kant ophav til?» spørger ikke til Kant selv, men til de
    // fænomener hans begreber førte til. Filosof → begreb → fænomen.
    if (dir === 'ud' && types.includes('GAVE_RISE_TO') && a.gruppe === 'filosof') {
      const egne = (out.get(a.id) || []).filter(e => ['INVENTED','DEVELOPED','REVISED','FOUNDED'].includes(e.type));
      const rows2 = [];
      for (const cb of egne) {
        const begreb = byId.get(cb.id);
        for (const e of out.get(cb.id) || []) {
          if (!ARTEFAKT_REL.includes(e.type) || !passType(e)) continue;
          const o = byId.get(e.id);
          rows2.push(rowFor(o, `via ${begreb.navn}`, TYPE_DA[o.undertype] || GROUP_DA[o.gruppe], e.kildeURL, e.evidens));
        }
      }
      if (rows2.length) {
        return answerList(`Hvad ${a.navn}s begreber gav ophav til`,
          `${a.navn} · ${GROUP_DA[a.gruppe]} · gennem ${egne.length} begreber`,
          rows2.slice(0, 40), `${a.navn}s begreber har ingen fænomener i grafen endnu.`);
      }
    }

    // Særlig hjælp: kritik af en filosof retter sig i grafen ofte mod begreberne.
    if (dir === 'in' && types.includes('CRITIQUED') && a.gruppe === 'filosof') {
      const egne = (out.get(a.id) || []).filter(e => ['INVENTED', 'FOUNDED'].includes(e.type)).map(e => e.id);
      const rows2 = [];
      for (const cid of egne) {
        const c = byId.get(cid);
        for (const e of inn.get(cid) || []) if (e.type === 'CRITIQUED') {
          rows2.push(rowFor(byId.get(e.id), `kritiseret ${c.navn}`, TYPE_DA[c.undertype] || GROUP_DA[c.gruppe], '', e.evidens));
        }
      }
      if (rows2.length) {
        return answerList(`Hvem kritiserede ${a.navn}?`,
          `Ingen kritik af ${a.navn} selv i grafen – men af begreber ${a.navn} stod bag:`,
          rows2, '');
      }
    }
    // Ingen træf: svar ærligt og vis hvad grafen faktisk har, i stedet for at
    // dumpe brugeren ned i en generisk opsummering.
    const liste = dir === 'in' ? (inn.get(a.id) || [])
      : (out.get(a.id) || []).filter(e => ['INVENTED','DEVELOPED','REVISED','CRITIQUED','FOUNDED','MEMBER_OF','INFLUENCED'].concat(ARTEFAKT_REL).includes(e.type));
    if (liste.length) {
      const tælling = {};
      for (const e of liste) tælling[e.type] = (tælling[e.type] || 0) + 1;
      const oversigt = Object.entries(tælling).sort((x, y) => y[1] - x[1])
        .map(([ty, n]) => `${n} ${relLabel(ty, dir)}`).join(', ');
      return answerList(type ? `Ingen ${lavOrd(type)} fundet for ${a.navn}` : `Hvad ${a.navn} står bag`,
        `${a.navn} · ${GROUP_DA[a.gruppe]}${type ? ' — grafen har i stedet' : ':'} ${oversigt}`,
        rowsOf(liste.slice(0, 30)),
        `Ingen ${lavOrd(type)} i grafen for ${a.navn}.`);
    }
  }

  // 3) Generisk: «hvad/hvilke … begreb …» uden verbum → alt filosoffen står bag
  if (/\b(hvad|hvilke|hvilken)\b/.test(t) && /begreb/.test(t)) {
    const rows = rowsOf((out.get(a.id)||[]).filter(e => ['INVENTED','DEVELOPED','REVISED','FOUNDED'].includes(e.type)));
    return answerList(`Hvad ${a.navn} står bag`, `${a.navn} · ${GROUP_DA[a.gruppe]}`, rows,
      `${a.navn} har ingen opfundne begreber i grafen.`);
  }

  // 4) «hvilke <type> er knyttet til X?» uden verbum → alle artefakter af typen
  if (type !== undefined) {
    const alle = (out.get(a.id)||[]).filter(e => ARTEFAKT_REL.includes(e.type));
    const rows = rowsOf(alle);
    if (rows.length) {
      return answerList(`${type ? (TYPE_DA[type] || type) + ' knyttet til ' : ''}${a.navn}`,
        `${a.navn} · ${GROUP_DA[a.gruppe]}`, rows, 'Ingen fundet af den type.');
    }
    return answerList(`Ingen ${lavOrd(type)} fundet for ${a.navn}`,
      `${a.navn} · ${GROUP_DA[a.gruppe]}${alle.length ? ` — grafen har ${alle.length} andre artefakter knyttet til noden` : ' — ingen artefakter knyttet til noden'}`,
      rowsOf(alle.slice(0, 30)), `Ingen ${lavOrd(type)} i grafen for ${a.navn}.`);
  }

  // 6) Er de forbundet?
  if (ents.length >= 2 && /\b(forbundet|relation|mellem)\b/.test(t)) {
    const b = byId.get(ents[1]);
    const direct = linkKey.get(a.id+'|'+b.id);
    if (direct) return answerList('Direkte forbindelse', `${a.navn} ↔ ${b.navn}`,
      [rowFor(b, REL_DA[direct.type] ? (direct.kilde===a.id ? REL_DA[direct.type][0] : REL_DA[direct.type][1]) : direct.type, '', direct.kildeURL, direct.evidens)], '');
    findPath(a.id, b.id); return '';
  }

  // 7) Fritekst → opsummering
  const o = out.get(a.id)||[], i = inn.get(a.id)||[];
  const invented = o.filter(e => e.type === 'INVENTED').length;
  const artifacts = o.filter(e => ARTEFAKT_REL.includes(e.type)).length;
  showAnswer(`<h3>${esc(a.navn)}</h3>
    <div class="sub">${esc(GROUP_DA[a.gruppe])}${a.born ? ` · ${a.born}–${a.died}` : ''}${a.year ? ` · ${a.year}` : ''}
    ${a.epoke ? ' · ' + esc(a.epoke) : ''}</div>
    ${a.note ? `<div class="sub" style="color:#cbd5e7">${esc(a.note)}</div>` : ''}
    <div class="sub">${invented} opfundne begreber · ${artifacts} artefakter · ${i.length} indgående relationer</div>
    <div class="chips" style="margin-top:4px">
      <div class="row" data-goto="${a.id}"><i>vis</i><b>Vis i universet</b></div>
    </div>`);
  flyTo(a.id);
  return '';
}

// answerQuery returnerer enten HTML til visning eller '' når svaret allerede
// er vist direkte (sti-animation eller opsummering).
function ask(text) {
  if (!text || !text.trim()) return;
  const html = answerQuery(text);
  if (html) showAnswer(html);
}

const answerEl = document.getElementById('answer');
function showAnswer(html) {
  if (!html) { answerEl.hidden = true; answerEl.innerHTML = ''; return; }
  answerEl.innerHTML = html;
  answerEl.hidden = false;
  for (const el of answerEl.querySelectorAll('[data-goto]')) el.onclick = () => flyTo(el.dataset.goto);
  // En evidensgrad i svaret filtrerer universet, så svaret også kan ses.
  for (const el of answerEl.querySelectorAll('[data-ev]')) el.onclick = () => {
    const v = el.dataset.ev;
    showAnswer(evidensSvar(v === 'alle' ? GRADE_IDS : [v]));
  };
  // En epoke i tidslinje-svaret zoomer til det tidsrum.
  for (const el of answerEl.querySelectorAll('[data-aar]')) el.onclick = () => {
    const [a, b] = el.dataset.aar.split('|').map(Number);
    zoomTilAar(a, b);
  };
}

const askEl = document.getElementById('ask');
document.getElementById('askBtn').onclick = () => ask(askEl.value);
askEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') ask(askEl.value); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { select(null); state.path = null; state.highlighting = null; showAnswer(''); } });

const PRESETS = [
  'Hvad opfandt Kant?',
  'Hvilke bygninger gav stoicismen ophav til?',
  'Hvilke institutioner udspringer af skolen for livet?',
  'Hvilke praksisser gav tilknytningsteorien ophav til?',
  'Hvem kritiserede Platon?',
  'Vis tidslinjen',
  'Hvor meget af grafen er dokumenteret?',
  'Hvad skrev Hannah Arendt?',
  'Find stien fra Rousseau til Montessori',
];
document.getElementById('chips').innerHTML = PRESETS.map(p => `<button data-p="${esc(p)}">${esc(p)}</button>`).join('');
for (const b of document.querySelectorAll('#chips button')) b.onclick = () => { askEl.value = b.dataset.p; ask(b.dataset.p); };

// ── UI-synkronisering ───────────────────────────────────────────────────────
const modesEl = document.getElementById('modes'), togglesEl = document.getElementById('toggles');
function syncUI() {
  for (const b of modesEl.children) b.classList.toggle('on', b.dataset.mode === state.mode);
  for (const c of togglesEl.querySelectorAll('input')) c.checked = state.groups[c.dataset.g];
}
for (const b of modesEl.children) b.onclick = () => {
  state.mode = b.dataset.mode;
  state.path = null; state.focus = null;
  // Tidslinjen har sit eget kamera (fladt, indpasset); universet får sit igen
  // når man går tilbage, så man ikke lander langt væk fra midten.
  if (state.mode === 'tidslinje') { state.groups.epoke = true; fitTidslinje(); }
  else { state.dist = 2300; state.panX = 0; state.panY = 0; }
  syncUI(); computeVisible();
};
for (const c of togglesEl.querySelectorAll('input')) c.onchange = () => {
  state.groups[c.dataset.g] = c.checked;
  // Afkrydsningerne skifter tilbage til «Alt» fra de faste udsnit (Filosoffer /
  // Begreber), men tidslinjen er en visning man bliver i: dens baner er netop
  // styret af de samme afkrydsninger og af «Epoker»-båndene.
  if (state.mode !== 'alt' && state.mode !== 'tidslinje') state.mode = 'alt';
  syncUI(); computeVisible();
};

// ── Tegnforklaring og kantfilter ────────────────────────────────────────────
// Noderne har hver sin farve; kanterne har deres evidensgrad. Graden kan slås
// til og fra i værktøjslinjen, så universet kan vise fx kun de kanter, der har
// en kilde. Filteret ligger øverst og ikke i tegnforklaringen, så det ikke
// dækker spørgefeltet nederst i billedet.
const legendEl = document.getElementById('legend');
const evidensEl = document.getElementById('evidens');
const antalPerGrad = DATA.meta.evidensFordeling || {};

// Tegnforklaringen holder sig til noderne og forbliver smal, så den ikke
// glider ind under spørgefeltet. Kanternes farver forklares i kantfiltret.
function renderLegend() {
  legendEl.innerHTML = Object.keys(COLORS)
    .map(g => `<div><span class="dot" style="background:${COLORS[g]}"></span>${GROUP_DA[g]}</div>`).join('');
}

function renderEvidensUI() {
  evidensEl.innerHTML = `<span class="lbl">Kanter</span>` + GRADE_IDS.map(id => {
    const g = GRADE.get(id);
    const stil = EVIDENS_STIPL[id] ? 'dashed' : 'solid';
    const titel = `${g.da} · ${antalPerGrad[id] || 0} kanter – ${g.forklaring}`;
    return `<button class="${state.evidens[id] === false ? '' : 'on'}" data-ev="${esc(id)}" title="${esc(titel)}">`
      + `<i style="border-top-color:${EVIDENS_FARVE[id]};border-top-style:${stil}"></i>${esc(g.kort || id)}</button>`;
  }).join('') + `<button data-ev-reset="1" title="Vis alle grader igen">↺</button>`;
  for (const b of evidensEl.querySelectorAll('button[data-ev]')) b.onclick = () => {
    state.evidens[b.dataset.ev] = state.evidens[b.dataset.ev] === false;
    computeVisible(); renderEvidensUI();
  };
  const nulstil = evidensEl.querySelector('button[data-ev-reset]');
  if (nulstil) nulstil.onclick = () => {
    for (const id of GRADE_IDS) state.evidens[id] = true;
    computeVisible(); renderEvidensUI();
  };
}

// ── Opstart ─────────────────────────────────────────────────────────────────
document.getElementById('sub').textContent =
  `${DATA.meta.filosoffer} filosoffer · ${DATA.meta.begreber} begreber · ${DATA.meta.artefakter} artefakter · ${DATA.meta.medBillede || 0} billeder`;
renderLegend();
renderEvidensUI();

resize();
bygTidslinje();
computeVisible();
step();
</script>
</body>
