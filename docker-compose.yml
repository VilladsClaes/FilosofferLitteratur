services:
  neo4j:
    image: neo4j:5.26-community
    container_name: filosoffer-neo4j
    ports:
      - "7474:7474"   # Neo4j Browser (http://localhost:7474)
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: "neo4j/filosoffer"
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1G"
      NEO4J_server_memory_pagecache_size: "512m"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - ./build:/import:ro
    healthcheck:
      # cypher-shell findes i image'et; slim-basisbilledet har hverken wget eller curl.
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p filosoffer 'RETURN 1' >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40

volumes:
  neo4j-data:
  neo4j-logs:
